<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f3">
<meta name="color-scheme" content="light dark">
<title>GyrotraffIC</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">
  <header id="top" class="top"></header>
  <main id="view" class="view" tabindex="-1"></main>
  <div id="sheetWrap" class="sheet-wrap" aria-hidden="true">
    <div class="scrim" id="scrim"></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-bar" id="sheetBar"><span class="grab" aria-hidden="true"></span>
        <button class="iconbtn" id="sheetClose" type="button"></button>
        <h1 id="sheetTitle" tabindex="-1"></h1>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>
  <nav id="tabs" class="tabbar" aria-label="GyrotraffIC"></nav>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<!-- 外部の CDN・通信は使わない。file:// で開けるよう ES モジュールでなく順に読む。 -->
<script src="sample/samples.js"></script>
<script src="js/i18n.js"></script>
<script src="js/icons.js"></script>
<script src="js/util.js"></script>
<script src="js/fx.js"></script>
<script src="js/store.js"></script>
<script src="js/data/static-provider.js"></script>
<script src="js/data/index.js"></script>
<script src="js/screens/home.js"></script>
<script src="js/screens/results.js"></script>
<script src="js/screens/detail.js"></script>
<script src="js/screens/saved.js"></script>
<script src="js/screens/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
